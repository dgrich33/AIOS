name: Organ Publish

on:
  push:
    tags:
      - "organ/*"
      - "v*"

env:
  KUBECTL_VERSION: "v1.36.1"
  KIND_NODE_IMAGE_REQUESTED: "kindest/node:v1.36.1"

jobs:
  organ-publish:
    runs-on: ubuntu-latest
    env:
      AIOS_REGISTRY_USERNAME: ${{ secrets.AIOS_REGISTRY_USERNAME }}
      AIOS_REGISTRY_PASSWORD: ${{ secrets.AIOS_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd aios-codex-organ-bridge && cargo test
      - run: kubectl version --client=true
      - run: npx -y @bufbuild/buf lint aios-codex-specs
      - run: python aios-codex-foundry/foundry.py
      - name: Sign organ manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for manifest in Path("deploy/registry/bootstrap/organs").glob("*/manifest.json"):
              sig = hashlib.sha256(manifest.read_bytes()).hexdigest()
              manifest.with_suffix(".sig").write_text(sig, encoding="utf-8")
          PY
      - name: Push to registry
        if: ${{ env.AIOS_REGISTRY_USERNAME != '' && env.AIOS_REGISTRY_PASSWORD != '' }}
        run: echo "Push signed organ artifacts to registry.aios.internal:5443"
      - name: Registry unavailable fallback
        if: ${{ env.AIOS_REGISTRY_USERNAME == '' || env.AIOS_REGISTRY_PASSWORD == '' }}
        run: echo "Registry credentials unavailable; kept signed artifacts in deploy/registry/bootstrap."
