name: CI

on:
  push:
  pull_request:

env:
  KUBECTL_VERSION: "v1.36.1"
  KIND_NODE_IMAGE_REQUESTED: "kindest/node:v1.36.1"
  KIND_NODE_IMAGE_FALLBACK: "kindest/node:v1.35.0"

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx -y @bufbuild/buf lint aios-codex-specs

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd aios-codex-organ-bridge && cargo test

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - name: Backend tests
        shell: pwsh
        run: |
          cd backend
          python -m pytest tests -q *>&1 | Tee-Object -FilePath pytest-output.txt
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $message = (Get-Content pytest-output.txt -Tail 120 | Out-String)
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Backend pytest failed::$message"
            exit $exitCode
          }
      - run: python aios-codex-fabric/sentinel/sentinel_dsl.py aios-codex-specs/policy/sentinel-default.v0.3.aiosdsl --out deploy/policy/sentinel-v0.3.manifest.json
      - run: python aios-codex-foundry/foundry.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - run: cd frontend && npm install && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Frontend e2e
        shell: bash
        run: |
          cd frontend
          set +e
          npm run test:e2e > e2e-output.txt 2>&1
          exit_code=$?
          cat e2e-output.txt
          if [ "$exit_code" -ne 0 ]; then
            message="$(tail -n 120 e2e-output.txt | python -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            echo "::error title=Frontend e2e failed::$message"
            exit "$exit_code"
          fi

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd mcp/aios-mcp-repo && npm install && npm run build
      - run: cd mcp/aios-mcp-core && npm install && npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: Verify kubectl client
        run: kubectl version --client=true
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version
      - name: Check requested kind node image
        shell: bash
        run: |
          if docker manifest inspect "$KIND_NODE_IMAGE_REQUESTED" >/dev/null 2>&1; then
            echo "KIND_NODE_IMAGE_EFFECTIVE=$KIND_NODE_IMAGE_REQUESTED" >> "$GITHUB_ENV"
          else
            echo "::warning title=kindest/node image unavailable::$KIND_NODE_IMAGE_REQUESTED was not found on Docker Hub; using $KIND_NODE_IMAGE_FALLBACK for CI render smoke."
            echo "KIND_NODE_IMAGE_EFFECTIVE=$KIND_NODE_IMAGE_FALLBACK" >> "$GITHUB_ENV"
          fi
      - name: Kind render smoke
        run: |
          kind create cluster --name aios-k8s-smoke --image "$KIND_NODE_IMAGE_EFFECTIVE"
          kubectl cluster-info --context kind-aios-k8s-smoke
          kubectl version -o json

  publish:
    if: startsWith(github.ref, 'refs/tags/organ/') || startsWith(github.ref, 'refs/tags/v')
    needs: [specs, bridge, backend, frontend, mcp, compose, kubernetes]
    runs-on: ubuntu-latest
    env:
      AIOS_REGISTRY_USERNAME: ${{ secrets.AIOS_REGISTRY_USERNAME }}
      AIOS_REGISTRY_PASSWORD: ${{ secrets.AIOS_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: python aios-codex-foundry/foundry.py
      - name: Publish organ bootstrap
        if: ${{ env.AIOS_REGISTRY_USERNAME != '' && env.AIOS_REGISTRY_PASSWORD != '' }}
        run: echo "Publishing signed organ bootstrap to registry.aios.internal:5443"
      - name: Skip publish without registry secrets
        if: ${{ env.AIOS_REGISTRY_USERNAME == '' || env.AIOS_REGISTRY_PASSWORD == '' }}
        run: echo "Registry secrets unavailable; bootstrap artifacts were built but not pushed."
