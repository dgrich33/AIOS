services:
  postgres:
    image: postgres:16-alpine
    container_name: aios_postgres
    environment:
      POSTGRES_DB: aios
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aios_redis
    ports:
      - "6379:6379"

  vault:
    image: hashicorp/vault:1.18
    container_name: aios_vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: local-dev-token-only
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"

  backend:
    build: ./backend
    container_name: aios_backend
    environment:
      AIOS_DATABASE_URL: postgresql+psycopg2://aios:aios_password@postgres:5432/aios
      AIOS_REDIS_URL: redis://redis:6379/0
      AIOS_JWT_SECRET: local-demo-change-me
      AIOS_VAULT_URL: http://vault:8200
      AIOS_VAULT_TOKEN: local-dev-token-only
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      vault:
        condition: service_started

  worker:
    build: ./backend
    container_name: aios_worker
    command: ["python", "-m", "app.worker"]
    environment:
      AIOS_DATABASE_URL: postgresql+psycopg2://aios:aios_password@postgres:5432/aios
      AIOS_REDIS_URL: redis://redis:6379/0
      AIOS_JWT_SECRET: local-demo-change-me
    depends_on:
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: aios_frontend
    environment:
      VITE_AIOS_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aios_prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: aios_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aios-grafana-admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started

  loki:
    image: grafana/loki:3.3.2
    container_name: aios_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.3.2
    container_name: aios_promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    depends_on:
      loki:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aios_alertmanager
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  otel:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: aios_otel
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/otel/config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  mcp_repo:
    image: node:24-alpine
    container_name: aios_mcp_repo
    working_dir: /mcp
    volumes:
      - ./mcp/aios-mcp-repo:/mcp
    command: sh -c "npm install && npm run build && tail -f /dev/null"

  mcp_core:
    image: node:24-alpine
    container_name: aios_mcp_core
    working_dir: /mcp
    volumes:
      - ./mcp/aios-mcp-core:/mcp
    command: sh -c "npm install && npm run build && tail -f /dev/null"

volumes:
  postgres_data:
