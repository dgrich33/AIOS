apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ui
    spec:
      imagePullSecrets:
        - name: aios-registry-pull-secret
      containers:
        - name: ui
          image: registry.aios.internal:5443/aios/ui:1.1-k8s1.36
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_AIOS_API_URL
              value: http://edge-gateway:8026
---
apiVersion: v1
kind: Service
metadata:
  name: aios-ui
spec:
  selector:
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 5173
      targetPort: 5173
