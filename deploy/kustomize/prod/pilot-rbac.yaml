apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aios-pilot
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aios-pilot
subjects:
  - kind: Group
    name: aios_pilot
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: aios-pilot
  apiGroup: rbac.authorization.k8s.io
