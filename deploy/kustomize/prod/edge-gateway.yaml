apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: edge-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/component: edge-gateway
    spec:
      imagePullSecrets:
        - name: aios-registry-pull-secret
      containers:
        - name: edge-gateway
          image: registry.aios.internal:5443/aios/edge-gateway:1.1-k8s1.36
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8026
          env:
            - name: AIOS_ENV
              value: production
            - name: FABRIC_ROUTER_URL
              value: http://fabric-router:8026
          readinessProbe:
            httpGet:
              path: /runtime/sovereign/status
              port: 8026
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
spec:
  selector:
    app.kubernetes.io/component: edge-gateway
  ports:
    - name: http
      port: 8026
      targetPort: 8026
