metadata:
  name: aios-registry-pull-secret
  namespace: aios-prod
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.aios.internal:5443": {
          "auth": "REPLACE_WITH_BASE64_USER_COLON_TOKEN"
        }
      }
    }
