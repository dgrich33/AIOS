apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: registry.aios.internal:5443/aios/frontend:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_AIOS_API_URL
              value: http://aios-backend:8000
---
apiVersion: v1
kind: Service
metadata:
  name: aios-frontend
spec:
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173
