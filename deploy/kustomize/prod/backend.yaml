apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
    spec:
      imagePullSecrets:
        - name: aios-registry-pull-secret
      containers:
        - name: backend
          image: registry.aios.internal:5443/aios/backend:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: AIOS_ENV
              value: production
            - name: AIOS_RUNTIME_PROVIDER
              value: aios_native_runtime
            - name: VAULT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: vault-creds
                  key: VAULT_BUCKET
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aios-backend
spec:
  selector:
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
